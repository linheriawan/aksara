version: "1.0"
name: "System Default Routes"
description: "Basic system routes available to all apps"
readonly: true
system: true
category: "default"
metadata:
  version: "1.0.0"
  lastModified: "2025-01-01T00:00:00.000Z"

routes:
  - id: home_001
    name: Home
    path: ""  # Root path
    icon: home
    order: 0
    visible: false  # Hidden from menu but exists as route
    readonly: true
    system: true
    pageConfig:
      type: component
      title: Welcome
      description: Application home page
      componentPath: $lib/components/pages/HomePage.svelte
      
  - id: account_001
    name: Account
    path: acc
    icon: user
    order: 98  # Near end but before designer
    visible: true
    readonly: true
    system: true
    pageConfig:
      type: component
      title: Account Management
      description: User account settings and preferences
      componentPath: $lib/components/pages/AccountManager.svelte
      objectRef: UserProfile
      config:
        props:
          allowProfileEdit: true