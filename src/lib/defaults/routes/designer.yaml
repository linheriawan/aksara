version: "1.0"
name: "Designer System Routes"
description: "Default designer/admin routes - readonly system templates"
readonly: true
system: true
category: "default"
metadata:
  version: "1.0.0"
  lastModified: "2025-01-01T00:00:00.000Z"

routes:
  - id: designer_001
    name: Designer
    path: designer
    icon: logo
    order: 999  # Always last in menu
    visible: true
    readonly: true
    system: true
    pageConfig:
      type: component
      title: Design System
      description: Manage your application design and configuration
      componentPath: $lib/components/pages/DesignerDashboard.svelte
      objectRef: Route
      config:
        props:
          theme: default
    children:
      - id: designer_modules_001
        name: Modules
        path: designer/modules
        icon: logo
        order: 0
        visible: true
        readonly: true
        system: true
        pageConfig:
          type: component
          title: Route Modules
          description: Manage application routes and navigation
          componentPath: $lib/components/pages/RouteManager.svelte
          objectRef: Route
          
      - id: designer_data_001
        name: Data
        path: designer/data
        icon: data
        order: 1
        visible: true
        readonly: true
        system: true
        pageConfig:
          type: component
          title: Data Management
          description: Configure data sources and object definitions
          componentPath: $lib/components/pages/DataManager.svelte
          objectRef: ObjectDef
          
      - id: designer_component_001
        name: Component
        path: designer/component
        icon: logo
        order: 2
        visible: true
        readonly: true
        system: true
        pageConfig:
          type: link
          title: Component Library
          description: Browse and manage reusable components
          config:
            targetType: component
            target: $lib/components/ComponentLibrary.svelte
            
      - id: designer_form_001
        name: Form
        path: designer/form
        icon: form
        order: 3
        visible: true
        readonly: true
        system: true
        pageConfig:
          type: form
          title: Form Builder
          description: Create and manage forms using object definitions
          componentPath: $lib/components/pages/FormBuilder.svelte
          objectRef: FormDef
          config:
            sections:
              - basic
              - fields
              - validation
            layout: tabbed