source: user
fields:
  - name: id
    type: string
    required: true
    mapping: id
  - name: name
    type: string
    required: false
    mapping: name
  - name: email
    type: string
    required: false
    mapping: email
  - name: last-login
    type: date
    required: false
    mapping: last-login
primaryKey: id
